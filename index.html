<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CBTA Progress Tracker</title>
<link rel="icon" id="favicon" href="data:,">
<meta name="theme-color" content="#0f1820">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
/* Layout: one-column task-card logbook. Sticky header, trainee list → trainee detail → task sheet. */
:root{
  --bg:#eef1f3; --surface:#ffffff; --surface-2:#e3e8ec; --line:#cdd5dc;
  --fg:#16212b; --muted:#5a6976;
  --accent:#5f7a1f;        /* zinc-chromate primer green */
  --accent-fg:#ffffff; --accent-soft:#e6edd3;
  --seq1:#dbe6bf; --seq2:#b5cb7e; --seq3:#86a240; --seqfg:#ffffff;
  --warn:#b46a00; --warn-soft:#f8ead2;
  --ok:#2f7a4a; --ok-soft:#dcefe2;
  --danger:#b23a2e;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10161c; --surface:#18212a; --surface-2:#222d37; --line:#2f3c48;
  --fg:#e5ebf0; --muted:#93a3b1;
  --accent:#a9c45a; --accent-fg:#141a0a; --accent-soft:#2b3418;
  --seq1:#2b3519; --seq2:#45561f; --seq3:#6f8a2f; --seqfg:#eef4dc;
  --warn:#e6a446; --warn-soft:#3a2c14; --ok:#6cc58c; --ok-soft:#173222; --danger:#ef7b6e;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10161c; --surface:#18212a; --surface-2:#222d37; --line:#2f3c48;
  --fg:#e5ebf0; --muted:#93a3b1;
  --accent:#a9c45a; --accent-fg:#141a0a; --accent-soft:#2b3418;
  --seq1:#2b3519; --seq2:#45561f; --seq3:#6f8a2f; --seqfg:#eef4dc;
  --warn:#e6a446; --warn-soft:#3a2c14; --ok:#6cc58c; --ok-soft:#173222; --danger:#ef7b6e;
  color-scheme:dark}

/* design presets (admin picks one for everyone) */
:root[data-preset="navy"]{--bg:#f2f5f9;--surface:#ffffff;--surface-2:#e6ebf2;--line:#d0d8e4;--fg:#0f1c2e;--muted:#56657a;--accent:#1f4e8c;--accent-fg:#ffffff;--accent-soft:#dde7f4;--seq1:#d6e2f2;--seq2:#9db8de;--seq3:#4a76b3;--seqfg:#ffffff;--display:"Inter",system-ui,sans-serif;--body:"Inter",system-ui,sans-serif}
@media (prefers-color-scheme: dark){:root[data-preset="navy"]:not([data-theme="light"]){--bg:#0b1220;--surface:#121b2c;--surface-2:#1b2639;--line:#2a3850;--fg:#e6ecf5;--muted:#93a2b8;--accent:#7fa8e6;--accent-fg:#0b1220;--accent-soft:#1c2c47;--seq1:#1a2a44;--seq2:#2b4a7a;--seq3:#4f7cc2;--seqfg:#eef3fb}}
:root[data-preset="navy"][data-theme="dark"]{--bg:#0b1220;--surface:#121b2c;--surface-2:#1b2639;--line:#2a3850;--fg:#e6ecf5;--muted:#93a2b8;--accent:#7fa8e6;--accent-fg:#0b1220;--accent-soft:#1c2c47;--seq1:#1a2a44;--seq2:#2b4a7a;--seq3:#4f7cc2;--seqfg:#eef3fb}
:root[data-preset="slate"]{--bg:#f4f4f5;--surface:#ffffff;--surface-2:#e9e9ec;--line:#d4d4d8;--fg:#18181b;--muted:#5f5f69;--accent:#0f766e;--accent-fg:#ffffff;--accent-soft:#d5ece9;--seq1:#d5ece9;--seq2:#8cc9c1;--seq3:#2a9d8f;--seqfg:#ffffff;--display:"Inter",system-ui,sans-serif;--body:"Inter",system-ui,sans-serif}
@media (prefers-color-scheme: dark){:root[data-preset="slate"]:not([data-theme="light"]){--bg:#0f1113;--surface:#17191c;--surface-2:#202327;--line:#30343a;--fg:#e8e9eb;--muted:#9a9fa6;--accent:#4fd1c5;--accent-fg:#06201d;--accent-soft:#133a36;--seq1:#133a36;--seq2:#1f6b63;--seq3:#2fa596;--seqfg:#eafffb}}
:root[data-preset="slate"][data-theme="dark"]{--bg:#0f1113;--surface:#17191c;--surface-2:#202327;--line:#30343a;--fg:#e8e9eb;--muted:#9a9fa6;--accent:#4fd1c5;--accent-fg:#06201d;--accent-soft:#133a36;--seq1:#133a36;--seq2:#1f6b63;--seq3:#2fa596;--seqfg:#eafffb}
:root[data-preset="red"]{--bg:#f5f3f2;--surface:#ffffff;--surface-2:#ebe7e5;--line:#d9d2cf;--fg:#1f1716;--muted:#6a5d5a;--accent:#b4231f;--accent-fg:#ffffff;--accent-soft:#f6dedc;--seq1:#f3d6d3;--seq2:#e09a94;--seq3:#c2453e;--seqfg:#ffffff}
@media (prefers-color-scheme: dark){:root[data-preset="red"]:not([data-theme="light"]){--bg:#141010;--surface:#1d1717;--surface-2:#282020;--line:#3a2f2e;--fg:#f0e9e8;--muted:#a89997;--accent:#f07a72;--accent-fg:#2a0a08;--accent-soft:#3d1d1b;--seq1:#3a1c1a;--seq2:#6e2f2b;--seq3:#b04a43;--seqfg:#fff1f0}}
:root[data-preset="red"][data-theme="dark"]{--bg:#141010;--surface:#1d1717;--surface-2:#282020;--line:#3a2f2e;--fg:#f0e9e8;--muted:#a89997;--accent:#f07a72;--accent-fg:#2a0a08;--accent-soft:#3d1d1b;--seq1:#3a1c1a;--seq2:#6e2f2b;--seq3:#b04a43;--seqfg:#fff1f0}
:root[data-preset="navy"] h1,:root[data-preset="navy"] h2,:root[data-preset="navy"] h3,:root[data-preset="slate"] h1,:root[data-preset="slate"] h2,:root[data-preset="slate"] h3{letter-spacing:-.01em;font-weight:700}
:root[data-preset="navy"] h1,:root[data-preset="slate"] h1{font-size:26px}
.presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.preset{display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left;padding:10px;font-weight:600}.preset.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}.preset .sw{display:flex;gap:4px}.preset .sw i{width:22px;height:22px;border-radius:6px;border:1px solid rgba(0,0,0,.12)}.preset small{font-weight:400;color:var(--muted);font-size:12px}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 48px;display:flex;flex-direction:column;gap:16px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .in{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;gap:12px}
.brand{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.02em;text-transform:uppercase;line-height:1}
.brand small{display:block;font-family:var(--mono);font-size:10.5px;font-weight:400;letter-spacing:.04em;color:var(--muted);text-transform:none;margin-top:3px}
.spacer{flex:1}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance;line-height:1.1}
h1{font-size:30px}
h2{font-size:21px;letter-spacing:.01em}
h3{font-size:17px}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.label{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
button,.btn{font:inherit;font-weight:600;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:9px 14px;cursor:pointer;min-height:40px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.row:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
button.ghost{background:transparent;border-color:transparent;color:var(--muted)}
button.danger{color:var(--danger)}
button.danger.armed{background:var(--danger);color:#fff;border-color:var(--danger)}
button:disabled{opacity:.5;cursor:not-allowed}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.notice{border-radius:10px;padding:10px 14px;background:var(--warn-soft);color:var(--fg);font-size:14px}
.notice.example{background:var(--accent-soft)}
/* trainee list */
.list{display:flex;flex-direction:column;gap:10px}
.row{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer;text-align:left;width:100%}
.row:hover{border-color:var(--accent)}
.row .name{font-weight:600;font-size:16px;min-width:0;overflow-wrap:anywhere}
.row .meta{font-size:13px;color:var(--muted);grid-column:1/-1}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;grid-column:1/-1}
.bar>span{display:block;height:100%;background:var(--accent);border-radius:99px}
.pct{font-family:var(--mono);font-weight:500;font-size:14px}
.empty{text-align:center;padding:32px 16px;display:flex;flex-direction:column;gap:10px;align-items:center}
/* trainee detail */
.ident{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13.5px;color:var(--muted)}
.ident b{color:var(--fg);font-weight:500}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface-2);border-radius:10px;padding:10px 12px}
.stat .v{font-family:var(--display);font-size:28px;font-weight:700;line-height:1}
.stat .k{font-size:12px;color:var(--muted);margin-top:4px}
.sec{display:grid;grid-template-columns:minmax(0,1fr) 64px;gap:4px 12px;align-items:center;font-size:14px}
.sec .bar{grid-column:1/-1}
.comps{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.comp{border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:grid;grid-template-columns:auto 1fr;gap:0 10px;align-items:center}
.comp .code{font-family:var(--display);font-weight:700;font-size:20px;width:34px}
.comp .cnt{font-family:var(--mono);font-size:13px}
.comp .nm{font-size:12px;color:var(--muted);line-height:1.25}
.comp[data-l="0"]{border-style:dashed}
.comp[data-l="0"] .code{color:var(--warn)}
.comp[data-l="1"]{background:var(--accent-soft)}
.comp[data-l="2"]{background:var(--accent-soft);border-color:var(--accent)}
.comp[data-l="3"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.comp[data-l="3"] .nm{color:var(--accent-fg);opacity:.85}
.tasks{display:flex;flex-direction:column}
.task{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:10px 4px;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;border-radius:0;text-align:left;width:100%;font-weight:400;min-height:0}
.task:hover{background:var(--surface-2)}
.task .t{font-size:14.5px;overflow-wrap:anywhere}
.task .s{font-size:12px;color:var(--muted);grid-column:1}
.pill{font-size:11.5px;font-weight:600;border-radius:99px;padding:3px 9px;white-space:nowrap;align-self:start}
.pill.done{background:var(--ok-soft);color:var(--ok)}
.pill.prog{background:var(--warn-soft);color:var(--warn)}
.pill.none{background:var(--surface-2);color:var(--muted)}
details.group{border-top:1px solid var(--line)}
details.group>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:12px 0}
details.group>summary::-webkit-details-marker{display:none}
details.group>summary::before{content:"▸";color:var(--muted);transition:transform .15s}
details.group[open]>summary::before{transform:rotate(90deg)}
.timeline{display:flex;flex-direction:column;gap:8px}
.entry{border-left:3px solid var(--line);padding:2px 0 2px 12px;font-size:14px}
.entry.signed{border-left-color:var(--ok)}
.entry .h{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.entry .c{font-family:var(--mono);font-size:12px;color:var(--muted)}
/* sheet */
.overlay{position:fixed;inset:0;background:rgba(10,15,20,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:700px){.overlay{align-items:center}.sheet{border-radius:16px;max-height:88%}}
.sheet .hd{display:flex;gap:10px;align-items:flex-start}
.sheet .hd>div{flex:1;min-width:0}
form{display:flex;flex-direction:column;gap:12px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fields .full{grid-column:1/-1}
@media (max-width:460px){.fields{grid-template-columns:1fr}}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:500;min-width:0}
input,select,textarea{font:inherit;font-size:15px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;min-height:40px}
textarea{min-height:64px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;width:1px;height:1px;min-height:0}
.chip span{display:inline-block;font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:.03em;border:1px solid var(--line);border-radius:8px;padding:7px 0;width:50px;text-align:center;cursor:pointer;background:var(--surface)}
.chip input:checked+span{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.chip input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;background:var(--ok-soft);border-radius:10px;padding:10px 12px}
.check input{width:20px;height:20px;min-height:0;margin-top:1px;accent-color:var(--ok)}
.actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:30}
.tabs{display:flex;gap:2px;background:var(--surface-2);border-radius:9px;padding:3px}
.tabs a{font-weight:600;font-size:13.5px;color:var(--muted);text-decoration:none;padding:6px 10px;border-radius:7px}
.tabs a.on{background:var(--surface);color:var(--fg)}
@media (max-width:520px){header.top .in{flex-wrap:wrap}.brand small{display:none}#btnExport{padding-inline:8px}}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:620px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi .v{font-family:var(--display);font-size:34px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.kpi .k{font-size:12.5px;color:var(--muted);margin-top:6px}
.dgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:760px){.dgrid{grid-template-columns:1fr}}
.hbars{display:flex;flex-direction:column;gap:8px}
.hb{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr) 48px;gap:10px;align-items:center;font-size:13.5px;background:none;border:0;padding:2px 0;min-height:0;font-weight:400;text-align:left;width:100%;border-radius:4px}
button.hb{cursor:pointer}
button.hb:hover .nm{text-decoration:underline}
.hb .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .track{height:14px;background:var(--surface-2);border-radius:0 4px 4px 0;position:relative}
.hb .fill{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:0 4px 4px 0;min-width:2px}
.hb:hover .fill{filter:brightness(1.12)}
.hb .val{font-family:var(--mono);font-size:12.5px;text-align:right;font-variant-numeric:tabular-nums}
.flag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--warn);margin-left:6px}
.heat{overflow-x:auto}
.heat table{border-collapse:separate;border-spacing:2px;font-size:12.5px;min-width:100%}
.heat th{font-weight:600;color:var(--muted);padding:2px 4px;text-align:center;font-family:var(--display);font-size:14px}
.heat th.rn{text-align:left;font-family:var(--body);font-size:12.5px;color:var(--fg);font-weight:500;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.heat td{width:34px;height:30px;text-align:center;border-radius:4px;font-family:var(--mono);font-variant-numeric:tabular-nums}
.h0{background:var(--surface-2);color:var(--muted)}
.h1{background:var(--seq1);color:var(--fg)}
.h2{background:var(--seq2);color:var(--fg)}
.h3{background:var(--seq3);color:var(--seqfg)}
.h4{background:var(--accent);color:var(--accent-fg)}
.cols{display:flex;align-items:flex-end;gap:2px;height:120px;border-bottom:1px solid var(--line);padding-top:16px}
.col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0;position:relative}
.col .b{width:100%;max-width:28px;background:var(--accent);border-radius:4px 4px 0 0}
.col .n{font-family:var(--mono);font-size:11px;color:var(--muted);margin-bottom:2px}
.col:hover .b{filter:brightness(1.12)}
.xax{display:flex;gap:2px;font-size:10.5px;color:var(--muted);font-family:var(--mono)}
.xax span{flex:1;text-align:center;min-width:0;overflow:hidden}
#tip{position:fixed;z-index:40;pointer-events:none;background:var(--fg);color:var(--bg);font-size:12.5px;padding:6px 9px;border-radius:6px;max-width:240px;line-height:1.35}

.rolesel{display:flex;flex-direction:column;gap:1px}
.rolesel .label{font-size:9.5px}
.rolesel select{min-height:32px;padding:4px 8px;font-size:13px;font-weight:600;width:auto}
.lookup{display:flex;flex-direction:row;gap:10px;align-items:flex-end;flex-wrap:wrap}
[hidden]{display:none!important}
/* behaviours */
.behs{display:flex;flex-direction:column;gap:6px}
.bc{border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.bc.on{border-color:var(--accent)}
.bh{display:flex;align-items:center;gap:8px;padding:5px 6px}
.bt{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:none;border:0;padding:4px;min-height:36px;text-align:left;font-weight:500;font-size:13.5px}
.bt .bn{flex:1;min-width:0}
.bt .bk{font-family:var(--mono);font-size:12px;color:var(--accent)}
.bt .car{color:var(--muted);transition:transform .15s}
.bc.open .car{transform:rotate(180deg)}
.bl{list-style:none;margin:0;padding:2px 10px 10px 10px;display:flex;flex-direction:column;gap:4px}
.bl label{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;line-height:1.4;padding:6px 8px;border-radius:8px;cursor:pointer}
.bl label:hover{background:var(--surface-2)}
.bl input{width:18px;height:18px;min-height:0;margin-top:1px;flex:none;accent-color:var(--accent)}
details.behlist{font-size:12.5px;color:var(--muted);margin-top:2px}
details.behlist summary{cursor:pointer}
details.behlist ul{margin:4px 0 0;padding-left:18px}
/* HUD status card: a deliberate cockpit-display look in both themes */
.hud{--hud-bg:#0f1820;--hud-bg2:#16232e;--hud-fg:#e8eef2;--hud-muted:#8fa2b0;--hud-grid:#2a3a47;--hud-accent:#b5d36a;--hud-gold:#e9c46a;
  background:linear-gradient(160deg,var(--hud-bg2),var(--hud-bg) 60%);color:var(--hud-fg);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:16px;border:1px solid #23323e;position:relative;overflow:hidden}
.hud::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(255,255,255,.018) 3px 4px);pointer-events:none}
.hud-label{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--hud-muted);font-weight:600}
.hud-muted{color:var(--hud-muted)}
.hud-top{display:flex;gap:14px;align-items:center}
.avatar{position:relative;flex:none;width:72px;height:72px;border-radius:14px;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:30px;color:var(--hud-bg);background:var(--hud-accent);box-shadow:0 0 0 3px var(--hud-bg),0 0 0 5px var(--hud-accent)}
.avatar .lv{position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);background:var(--hud-gold);color:#1d1606;font-family:var(--mono);font-size:11px;font-weight:600;padding:1px 7px;border-radius:99px;white-space:nowrap}
.who{min-width:0}
.hud-name{font-family:var(--display);font-weight:700;font-size:28px;line-height:1.05;overflow-wrap:anywhere}
.rank{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;margin-top:4px;font-size:13px}
.rank b{color:var(--hud-fg)}
.rk{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--hud-gold)}
.meters{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.meters{grid-template-columns:1fr}}
.mh{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--hud-muted);margin-bottom:5px}
.mh .mono{color:var(--hud-fg)}
.mbar{height:10px;border-radius:99px;background:#0a1117;border:1px solid var(--hud-grid);overflow:hidden}
.mbar span{display:block;height:100%;background:var(--hud-accent);border-radius:99px;box-shadow:0 0 10px rgba(181,211,106,.5)}
.mbar.xp span{background:var(--hud-gold);box-shadow:0 0 10px rgba(233,196,106,.45)}
.hud-body{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;align-items:start;position:relative;z-index:1}
@media (max-width:620px){.hud-body{grid-template-columns:1fr}}
.radarbox{display:flex;flex-direction:column;gap:4px;min-width:0}
.radar{width:100%;max-width:360px;margin:0 auto;display:block}
.hud-side{display:flex;flex-direction:column;gap:10px;min-width:0}
.hl{display:flex;flex-direction:column;gap:2px;background:rgba(255,255,255,.04);border:1px solid var(--hud-grid);border-radius:10px;padding:8px 10px;font-size:14px}
.badges{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.badge{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;min-width:0}
.badge svg{width:40px;height:44px}
.badge .hx{fill:#0a1117;stroke:var(--hud-grid);stroke-width:2}
.badge .ht{font-family:var(--mono);font-size:9.5px;font-weight:600;fill:var(--hud-muted)}
.badge.got .hx{fill:var(--hud-gold);stroke:#fff3c4}
.badge.got .ht{fill:#1d1606}
.badge .bn{font-size:10.5px;line-height:1.15;color:var(--hud-muted)}
.badge.got .bn{color:var(--hud-fg);font-weight:600}
.badge .bp{font-family:var(--mono);font-size:10px;color:var(--hud-muted)}
.hud-foot{font-size:11px;position:relative;z-index:1}
#btnExport,.brand small{white-space:nowrap}
@media (max-width:900px){.brand small{display:none}}
.userchip{display:flex;align-items:center;gap:6px;font-size:13px;line-height:1.2;text-align:right}
.userchip b{display:block;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.userchip .label{font-size:10px}
.hero{display:flex;flex-direction:column;gap:6px}
.hero a,.panel a{color:var(--accent);font-weight:600}
.ulist{display:flex;flex-direction:column}
.urow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.urow select{width:auto;min-height:36px}

.tabs a{position:relative;white-space:nowrap}
.tabs .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--warn);vertical-align:2px}
header.top .in{flex-wrap:wrap;row-gap:8px}#navTabs{order:3;width:100%;overflow-x:auto}#navTabs a{flex:1;text-align:center}
a.userchip{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--fg);padding:4px 8px 4px 4px;border-radius:99px;border:1px solid transparent;text-align:left}
a.userchip:hover,a.userchip.on{border-color:var(--line);background:var(--surface-2)}
.ucav{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-fg);font-family:var(--display);font-weight:700;font-size:14px;flex:none}
.uctx{display:flex;flex-direction:column;line-height:1.15;min-width:0}
@media (max-width:420px){.uctx{display:none}}
a.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;color:var(--fg);font-weight:600;font-size:14px}
.idcard{gap:14px}
.idtop{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.idav{width:64px;height:64px;border-radius:16px;display:grid;place-items:center;background:var(--accent);color:var(--accent-fg);font-family:var(--display);font-weight:700;font-size:26px;flex:none}
.idgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px 16px;margin:0}
.idgrid dt{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.idgrid dd{margin:2px 0 0;font-size:14.5px;overflow-wrap:anywhere}
.rolebadge{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:6px;padding:3px 8px;background:var(--surface-2);color:var(--muted);margin-top:4px}
.rolebadge.r-admin{background:var(--fg);color:var(--bg)}
.rolebadge.r-assessor{background:var(--accent);color:var(--accent-fg)}
.rolebadge.r-pembina{background:var(--warn-soft);color:var(--warn)}
.rolebadge.r-mekanik,.rolebadge.r-engineer{background:var(--accent-soft);color:var(--accent)}
.setgrid{display:grid;grid-template-columns:1fr;gap:16px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;width:1px;height:1px;min-height:0}
.seg span{display:inline-block;padding:8px 14px;border:1px solid var(--line);border-radius:8px;cursor:pointer;font-weight:600;font-size:14px}
.seg input:checked+span{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.seg input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.exrow{display:flex;gap:12px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;padding-top:10px;border-top:1px solid var(--line)}
.exrow>div{min-width:0;flex:1}
.req{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.reqact{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:520px){.req{grid-template-columns:1fr}.reqact{justify-content:flex-start}}
/* auth */
.authwrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:0;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:var(--surface);margin-top:8px}
@media (max-width:720px){.authwrap{grid-template-columns:1fr}}
.authside{--hud-muted:#8fa2b0;background:linear-gradient(160deg,#16232e,#0f1820 65%);color:#e8eef2;padding:28px;display:flex;flex-direction:column;gap:12px;justify-content:flex-end;min-height:220px;position:relative;overflow:hidden}
.authside::before{content:"";position:absolute;right:-60px;top:-60px;width:240px;height:240px;border-radius:50%;border:2px solid rgba(181,211,106,.35);box-shadow:0 0 0 30px rgba(181,211,106,.06),0 0 0 60px rgba(181,211,106,.04)}
.authbrand{font-family:var(--display);font-weight:700;font-size:52px;line-height:.9;letter-spacing:.01em;text-transform:uppercase;color:#b5d36a}
.authside p{margin:0;color:#b9c7d1;max-width:34ch;font-size:14.5px}
.authcard{border:0;border-radius:0;padding:28px;gap:16px}
.authcard a{color:var(--accent);font-weight:600}
.pw{display:flex;gap:6px}
.pw input{flex:1;min-width:0}
.pwt{min-height:40px;padding-inline:10px;font-size:13px}
fieldset.rolepick{border:0;padding:0;margin:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
fieldset.rolepick legend{margin-bottom:6px}
@media (max-width:520px){fieldset.rolepick{grid-template-columns:1fr}}
.rolepick label{position:relative}
.rolepick input{position:absolute;opacity:0;width:1px;height:1px;min-height:0}
.rolepick span{display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;height:100%}
.rolepick b{font-family:var(--display);font-size:18px}
.rolepick small{color:var(--muted);font-size:12.5px;line-height:1.3}
.rolepick input:checked+span{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.rolepick input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* branding: admin icon + background for every account */
.blogo{width:36px;height:36px;border-radius:8px;object-fit:contain;flex:none}
.authlogo{width:64px;height:64px;border-radius:14px;object-fit:contain;background:rgba(255,255,255,.08);padding:6px;position:relative}
body.hasbg::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:linear-gradient(color-mix(in srgb,var(--bg) 72%,transparent),color-mix(in srgb,var(--bg) 72%,transparent)),var(--brand-bg) center/cover no-repeat}
.hdout{font-size:13.5px;min-height:36px;padding:6px 10px;flex:none}
@media (max-width:640px){.hdout{padding:6px 8px}}
.brandset{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.brandset>div{display:flex;flex-direction:column;gap:8px;min-width:0}
.bprev{height:96px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2) center/cover no-repeat;display:grid;place-items:center;color:var(--muted);font-size:13px}
.bprev img{max-width:72px;max-height:72px;object-fit:contain}
.brow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.brow input[type=color]{width:48px;height:40px;padding:2px;border-radius:8px;border:1px solid var(--line);background:var(--surface)}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.refs{display:flex;flex-direction:column;gap:6px}
.refrow{display:flex;flex-direction:row;gap:6px;align-items:center}
.refrow input{flex:1;min-width:0}
.refrow button{min-height:40px;padding:6px 10px;flex:none}
.addref{align-self:flex-start;padding-left:0;color:var(--accent)}
/* round 4: milestones, references, user admin */
.mtrack{position:relative}
.mtick{position:absolute;top:-4px;width:3px;height:18px;margin-left:-1.5px;border-radius:2px;background:var(--hud-gold);box-shadow:0 0 0 2px var(--hud-bg)}
.mtick.got{background:var(--hud-accent)}
.mstones{display:flex;gap:8px;flex-wrap:wrap;position:relative;z-index:1}
.ms{flex:1 1 170px;min-width:0;border:1px solid var(--hud-grid);border-radius:10px;padding:8px 10px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 10px;align-items:center}
.msp{grid-row:span 2;font-family:var(--display);font-weight:700;font-size:24px;line-height:1;color:var(--hud-gold)}
.msl{font-size:13px;font-weight:600;color:var(--hud-fg);line-height:1.25}
.mss{font-size:11.5px;color:var(--hud-muted)}
.ms.got{border-color:var(--hud-accent);background:rgba(181,211,106,.1)}
.ms.got .msp,.ms.got .mss{color:var(--hud-accent)}
.msgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.msbox{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.msh{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.msh b{font-family:var(--display);font-size:24px;line-height:1}
.mslist{display:flex;flex-wrap:wrap;gap:6px}
.mslist a{font-size:13px;padding:3px 9px;border-radius:99px;background:var(--surface-2);color:var(--fg);text-decoration:none}
.refbox{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.refchips{display:flex;flex-wrap:wrap;gap:6px}
.refchip{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--line);background:var(--surface-2);border-radius:99px;padding:2px 4px 2px 10px;font-size:13px}
.refchip button{min-height:28px;padding:2px 8px;font-size:12px}
.refchip:not(:has(button)){padding-right:10px}
.rtask{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.rtask:first-of-type{border-top:0}
.rth{display:flex;gap:8px;justify-content:space-between;align-items:baseline;flex-wrap:wrap}
.rtools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.rtools input[type=search]{flex:1 1 220px;min-width:0}
.hb.wide{grid-template-columns:minmax(0,1fr) minmax(0,40%) 74px}
.hb.wide .nm{white-space:normal}
.uedit{grid-column:1/-1;display:flex;flex-direction:column;gap:10px;background:var(--surface-2);border-radius:10px;padding:12px}
.uact{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.task .rc{font-size:12px;color:var(--muted)}
/* round 5: units, guide from the book */
.guide{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface-2)}
.guide>summary{cursor:pointer;display:flex;flex-direction:column;gap:2px;list-style:none}
.guide>summary::-webkit-details-marker{display:none}
.guide>summary b::before{content:"▸ ";color:var(--muted)}
.guide[open]>summary b::before{content:"▾ "}
.glist{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:7px}
.glist li{display:grid;grid-template-columns:92px minmax(0,1fr);gap:10px;font-size:13.5px;align-items:start;line-height:1.4}
.gk{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;border-radius:6px;padding:3px 6px;text-align:center;margin-top:1px}
.g-d{background:var(--accent);color:var(--accent-fg)}
.g-q{background:var(--warn-soft);color:var(--warn)}
.g-o{background:var(--ok-soft);color:var(--ok)}
.gcrit{margin-top:10px;font-size:13px;border-top:1px solid var(--line);padding-top:8px}
.gcrit summary{cursor:pointer;color:var(--muted);font-weight:600}
.gcrit ul{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.unitbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.unitbar select,.psort{width:auto;min-height:38px;max-width:100%}
.ugrp{display:flex;flex-direction:column;gap:8px}
.ugrp+.ugrp{margin-top:6px;padding-top:10px;border-top:1px solid var(--line)}
.ugh{display:flex;gap:8px;justify-content:space-between;align-items:baseline;flex-wrap:wrap;font-size:13px}
.ugh b{font-family:var(--display);font-size:16px;letter-spacing:.02em}
.ulist2{display:flex;flex-direction:column;gap:10px}
.ulist2 h3{display:flex;justify-content:space-between;gap:8px;align-items:baseline;font-size:17px}
.utable{width:100%;border-collapse:collapse;font-size:13.5px}
.utable th,.utable td{padding:7px 8px;border-top:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
.utable th:first-child,.utable td:first-child{text-align:left}
.utable thead th{border-top:0;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.utable tbody tr{cursor:pointer}
.utable tbody tr:hover{background:var(--surface-2)}
.utable .mini{display:inline-block;width:70px;height:8px;border-radius:99px;background:var(--surface-2);vertical-align:middle;margin-right:6px;overflow:hidden}
.utable .mini span{display:block;height:100%;background:var(--accent)}
.uwrap{overflow-x:auto}
.unrows{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px}

/* assessment forms */
.xprev{position:relative;overflow:hidden;background:#fff;border:1px solid var(--line);border-radius:8px}
.xprev.edit{overflow:auto;max-height:80vh}
.xprev>.xin{transform-origin:0 0}
.xsheet{position:relative;background:#fff;color:#000;font:10pt Arial,sans-serif;text-align:left;line-height:normal}
.xsheet table{border-collapse:collapse;table-layout:fixed;margin:0}
.xsheet td{padding:0 2px;overflow:visible;white-space:pre;line-height:1.1;position:relative;border:0;background:transparent;color:inherit}
.xsheet .xc{overflow-x:visible;overflow-y:clip}
.xsheet img{position:absolute;max-width:none}
.xsheet .xsig{position:absolute;display:flex;align-items:center;justify-content:center;pointer-events:none}
.xsheet .xsig img{position:static;max-width:100%;max-height:100%;object-fit:contain}
.xsheet td.xcirc .xc::after{content:"";position:absolute;inset:-1px 4px;border:1.6px solid #000;border-radius:50%}
.xsheet [data-tpl]{outline:1px dashed rgba(95,122,31,.55);cursor:text}
.xsheet [data-tpl]:focus{outline:2px solid #5f7a1f;background:#f4f8e8}
.fform{display:flex;flex-direction:column;gap:12px}
.fh{margin:6px 0 0;font-size:15px}
.glist2{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.gitem{display:grid;grid-template-columns:28px 1fr auto;gap:8px 10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line);font-size:14px;font-weight:400}
.gitem:first-child{border-top:0}
.gno{font-family:var(--mono);color:var(--muted);text-align:center}
.gin{display:flex;align-items:center;gap:8px}
.gin input{width:92px}
.gin .pill{min-width:48px;text-align:center}
.gin .mono{min-width:52px;text-align:right;font-family:var(--mono)}
.gsub summary{font-size:12.5px;color:var(--muted);cursor:pointer}
.gsub ol{margin:4px 0 0;padding-left:20px;font-size:13px;color:var(--muted)}
@media (max-width:520px){.gitem{grid-template-columns:24px 1fr}.gin{grid-column:2}}
.fsum{font-size:14px;text-align:right}
.sigs{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.sigslot{border:1px dashed var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.sigslot.on{border-style:solid;border-color:var(--ok)}
.sigslot .sl{font-weight:600;font-size:13px}
.sigslot img{max-width:100%;height:56px;object-fit:contain;background:#fff;border-radius:6px}
.sigslot .sn{font-size:13.5px}
#sigPad{width:100%;max-width:600px;aspect-ratio:600/220;background:#fff;border:1px solid var(--line);border-radius:10px;touch-action:none;cursor:crosshair}
.sigcur{display:flex;align-items:center;gap:10px}
.sigcur img{height:56px;max-width:220px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:6px;padding:2px}
#printArea{display:none}
@media print{
  body>*:not(#printArea),body::before,body::after,html::before,html::after{display:none!important}
  #printArea{display:block}
  html,body{background:#fff!important;background-image:none!important;padding:0!important;margin:0!important;min-height:0!important}
  :root{padding:0!important}
  #printArea,#printArea *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>

<header class="top"><div class="in">
  <img class="blogo" id="brandIcon" alt="" hidden>
  <div class="brand">CBTA Tracker<small>BT-RRF-079/R0 · Fundamental OJT Task List</small></div>

</div></header>

function shrinkImage(file,max,type,q){return new Promise((res,rej)=>{if(!file||!/^image\//.test(file.type)){rej(new Error("type"));return}

/* ---------- manual references ---------- */
const fromRef=r=>({id:r.id,traineeId:r.trainee_id,taskId:r.task_id,ref:r.ref,createdAt:r.created_at});
const refKey=v=>String(v||"").toUpperCase().replace(/[‐-―]/g,"-").replace(/\s*-\s*/g,"-").replace(/\s+/g," ").replace(/[.,;:]+$/,"").trim();
const splitRefs=v=>String(v||"").split(/\s*;\s*/).map(x=>x.trim()).filter(Boolean);
/* every reference use: from assessor entries and from mechanics' own list; same spelling (case, spaces, dashes) = one reference */
function refTrends(){
  const by={};const add=(taskId,traineeId,ref,date)=>{const k=refKey(ref);if(!k||!TASK[taskId])return;const t=(by[taskId]=by[taskId]||{});
    const e=(t[k]=t[k]||{key:k,spell:{},mechs:new Set(),uses:0,last:""});e.spell[ref]=(e.spell[ref]||0)+1;e.mechs.add(traineeId);e.uses++;if((date||"")>e.last)e.last=date||""};
  S.signoffs.forEach(x=>splitRefs(x.reference).forEach(r=>add(x.taskId,x.traineeId,r,x.date)));
  S.refs.forEach(x=>add(x.taskId,x.traineeId,x.ref,(x.createdAt||"").slice(0,10)));
  const res={};Object.entries(by).forEach(([tid,m])=>{res[tid]=Object.values(m).map(e=>({...e,label:Object.entries(e.spell).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]))[0][0]}))
    .sort((a,b)=>b.mechs.size-a.mechs.size||b.uses-a.uses||a.label.localeCompare(b.label))});
  return res}
function refSuggest(taskId){const tr=refTrends();const own=(tr[taskId]||[]).map(e=>e.label);const seen=new Set(own.map(refKey));
  const other=Object.values(tr).flat().filter(e=>!seen.has(e.key)&&seen.add(e.key)).map(e=>e.label);return own.concat(other).slice(0,60)}
function refsBlock(t,taskId){
  const mine=S.refs.filter(r=>r.traineeId===t.id&&r.taskId===taskId);
  const own=ROLE==="mekanik"&&ME.profile?.trainee_id===t.id;const canDel=own||ROLE==="admin";
  return `<div class="refbox"><h3>${own?"Referensi manual saya":"Referensi manual dari mekanik"}</h3>
    ${mine.length?`<div class="refchips">${mine.map(r=>`<span class="refchip"><span class="mono">${esc(r.ref)}</span>${canDel?`<button type="button" class="ghost" data-rdel="${esc(r.id)}" aria-label="Hapus ${esc(r.ref)}">✕</button>`:""}</span>`).join("")}</div>`
      :`<p class="muted" style="margin:0;font-size:13px">${own?"Belum ada. Tambahkan manual yang Anda pakai untuk tugas ini, mis. AMM, TSM, IPC, atau SRM.":"Mekanik belum menambahkan referensi untuk tugas ini."}</p>`}
    ${own?`<form id="fRef" class="refrow"><input id="rNew" maxlength="120" placeholder="mis. AMM 12-13-11" list="refSug" aria-label="Referensi baru" autocomplete="off" required><button type="submit" class="primary">Tambah</button></form>`:""}
  </div>`}
function drawRefs(){const box=$("#shRefs");if(!box||!sheetCtx)return;const {t,taskId}=sheetCtx;box.innerHTML=refsBlock(t,taskId);
  box.querySelectorAll("[data-rdel]").forEach(b=>b.onclick=async()=>{b.disabled=true;const {error}=await sb.from("task_refs").delete().eq("id",b.dataset.rdel);
    if(error){b.disabled=false;toast("Gagal menghapus referensi.");return}S.refs=S.refs.filter(r=>r.id!==b.dataset.rdel);drawRefs();toast("Referensi dihapus")});
  const f=$("#fRef");if(f)f.onsubmit=async e=>{e.preventDefault();const inp=$("#rNew");const ref=inp.value.trim().replace(/\s+/g," ");if(!ref)return;
    if(S.refs.some(r=>r.traineeId===t.id&&r.taskId===taskId&&refKey(r.ref)===refKey(ref))){toast("Referensi ini sudah ada.");return}
    const btn=f.querySelector("button");btn.disabled=true;
    const {data,error}=await sb.from("task_refs").insert({trainee_id:t.id,task_id:taskId,ref}).select().single();btn.disabled=false;
    if(error){toast(error.code==="23505"?"Referensi ini sudah ada.":error.code==="42P01"||/task_refs/.test(error.message||"")?"Fitur referensi belum aktif. Hubungi admin.":"Gagal menyimpan referensi.");return}
    S.refs.push(fromRef(data));drawRefs();toast("Referensi ditambahkan");const ni=$("#rNew");if(ni)ni.focus()}}

/* ---------- reference trends (staff) ---------- */
let REFQ="",REFALL=false;
function refsView(){
  const tr=refTrends();const glob={};
  Object.entries(tr).forEach(([tid,list])=>list.forEach(e=>{const g=(glob[e.key]=glob[e.key]||{label:e.label,mechs:new Set(),tasks:new Set(),uses:0});e.mechs.forEach(m=>g.mechs.add(m));g.tasks.add(tid);g.uses+=e.uses}));

/* ---------- game-style status ---------- */
const RANKS=[[0,"Rookie"],[10,"Apprentice"],[25,"Technician"],[45,"Specialist"],[60,"Senior Specialist"],[68,"CBTA Certified"]];
const BADGES={gse:["Ground Crew","GSE"],svc:["Servicer","SVC"],mov:["Ramp Operator","RMP"],haz:["Safety Sentinel","SAF"],doc:["Paper Trail","DOC"],tool:["Tool Master","TLS"],env:["All-Weather","ENV"],sp:["Standard Bearer","STD"]};
let STAT_MAX=10; /* observasi untuk stat penuh (100), diatur admin */
/* ---------- milestones (admin can change) ---------- */
let MILESTONES=[{pct:85,label:"Dapat diajukan rating"},{pct:95,label:"Dapat diajukan test AMEL"}];
function cleanMilestones(v){if(!Array.isArray(v))return null;const seen=new Set();
  return v.map(m=>({pct:Math.round(+m.pct),label:String(m.label||"").trim().slice(0,80)})).filter(m=>m.pct>=1&&m.pct<=100&&m.label&&!seen.has(m.pct)&&seen.add(m.pct)).sort((a,b)=>a.pct-b.pct).slice(0,8)}
function tasksFor(pct){return Math.ceil(pct/100*TOTAL)}
function milestoneState(done){return MILESTONES.map(m=>({...m,need:tasksFor(m.pct),got:done>=tasksFor(m.pct)}))}
function gameFor(t){
  const st=statsFor(t.id);const done=st.done.size;
  const obs=Object.values(st.comp).reduce((a,b)=>a+b,0);const behN=st.entries.reduce((a,e)=>a+(e.beh||[]).length,0);
  const xp=done*100+st.entries.length*25+obs*5+behN*2;
  const lvl=1+Math.floor(xp/400);const into=xp%400;
  let ri=0;RANKS.forEach((r,i)=>{if(done>=r[0])ri=i});
  const next=RANKS[ri+1];
  const stats=COMPS.map(([c,n])=>({c,n,v:Math.min(100,Math.round(st.comp[c]/STAT_MAX*100)),raw:st.comp[c]}));
  const badges=SECTIONS.map(([sid,sname,list])=>{const ids=list.map((_,i)=>sid+"-"+(i+1));const d=ids.filter(i=>st.done.has(i)).length;return {sid,sname,d,n:ids.length,got:d===ids.length,name:BADGES[sid][0],tag:BADGES[sid][1]}});
  const top=[...stats].sort((a,b)=>b.raw-a.raw)[0];const low=[...stats].sort((a,b)=>a.raw-b.raw)[0];
  return {st,done,xp,lvl,into,rank:RANKS[ri][1],next,stats,badges,top,low};
}
function radar(stats){
  const N=stats.length,cx=160,cy=150,R=96;const pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/N;return [cx+r*Math.cos(a),cy+r*Math.sin(a)]};
  const rings=[25,50,75,100].map(k=>`<polygon points="${stats.map((_,i)=>pt(i,R*k/100).join(",")).join(" ")}" fill="none" stroke="var(--hud-grid)" stroke-width="1"/>`).join("");
  const spokes=stats.map((_,i)=>{const [x,y]=pt(i,R);return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--hud-grid)" stroke-width="1"/>`}).join("");
  const poly=stats.map((s,i)=>pt(i,R*Math.max(s.v,3)/100).join(",")).join(" ");
  const dots=stats.map((s,i)=>{const [x,y]=pt(i,R*Math.max(s.v,3)/100);return `<circle cx="${x}" cy="${y}" r="4" fill="var(--hud-accent)" stroke="var(--hud-bg)" stroke-width="2"/><circle cx="${x}" cy="${y}" r="12" fill="transparent" data-tip="${esc(`${s.c} · ${s.n}: ${s.raw}× teramati (stat ${s.v}/100)`)}"/>`}).join("");
  const labels=stats.map((s,i)=>{const [x,y]=pt(i,R+24);return `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="middle" fill="var(--hud-fg)" font-family="Barlow Condensed, Arial Narrow, sans-serif" font-weight="700" font-size="14">${s.c}<tspan x="${x}" dy="13" font-family="IBM Plex Mono, monospace" font-weight="400" font-size="10" fill="var(--hud-muted)">${s.v}</tspan></text>`}).join("");
  return `<svg viewBox="0 0 320 306" class="radar" role="img" aria-label="Radar 11 kompetensi">${rings}${spokes}<polygon points="${poly}" fill="var(--hud-accent)" fill-opacity=".28" stroke="var(--hud-accent)" stroke-width="2" stroke-linejoin="round"/>${dots}${labels}</svg>`;
}
function statusCard(t){
  const g=gameFor(t);const pct=Math.round(g.done/TOTAL*100);const ms=milestoneState(g.done);
  const nextTxt=g.next?`${g.next[0]-g.done} tugas lagi menuju <b>${g.next[1]}</b>`:"Semua tugas Fundamental selesai";
  const initials=(t.name||"?").split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase();
  const badges=g.badges.map(b=>`<div class="badge ${b.got?"got":""}" data-tip="${esc(`${b.name} · ${b.sname}: ${b.d}/${b.n} tugas`)}"><svg viewBox="0 0 40 44" aria-hidden="true"><polygon points="20,2 38,12 38,32 20,42 2,32 2,12" class="hx"/><text x="20" y="25" text-anchor="middle" class="ht">${b.tag}</text></svg><span class="bn">${esc(b.name)}</span><span class="bp">${b.got?"Terbuka":b.d+"/"+b.n}</span></div>`).join("");
  return `<section class="hud" aria-label="Kartu status mekanik">
    <div class="hud-top">
      <div class="avatar" aria-hidden="true">${esc(initials)}<span class="lv">LV ${g.lvl}</span></div>
      <div class="who"><div class="hud-label">Kartu Status · ${esc(t.empNo||"tanpa ID")}</div><div class="hud-name">${esc(t.name)}</div>
        <div class="rank"><span class="rk">${esc(g.rank)}</span><span class="hud-muted">${nextTxt}</span></div></div>
    </div>
    <div class="meters">
      <div class="meter"><div class="mh"><span>Progres tugas</span><span class="mono">${g.done}/${TOTAL} · ${pct}%</span></div><div class="mtrack"><div class="mbar"><span style="width:${pct}%"></span></div>${ms.map(m=>`<i class="mtick ${m.got?"got":""}" style="left:${m.pct}%" data-tip="${esc(`Milestone ${m.pct}% (${m.need} tugas): ${m.label}`)}"></i>`).join("")}</div></div>
      <div class="meter"><div class="mh"><span>XP level ${g.lvl}</span><span class="mono">${g.into}/400 · total ${g.xp} XP</span></div><div class="mbar xp"><span style="width:${g.into/4}%"></span></div></div>
    </div>
    ${ms.length?`<div class="mstones" aria-label="Milestone">${ms.map(m=>`<div class="ms ${m.got?"got":""}"><span class="msp">${m.pct}%</span><span class="msl">${esc(m.label)}</span><span class="mss">${m.got?"✓ Tercapai":`${m.need-g.done} tugas lagi (target ${m.need}/${TOTAL})`}</span></div>`).join("")}</div>`:""}
    <div class="hud-body">
      <div class="radarbox">${radar(g.stats)}<div class="hud-muted" style="font-size:11.5px;text-align:center">Stat = jumlah observasi kompetensi · ${STAT_MAX}× = 100</div></div>
      <div class="hud-side">
        <div class="hl"><span class="hud-label">Kompetensi terkuat</span><b>${g.top.raw?esc(g.top.c+" · "+g.top.n):"–"}</b></div>
        <div class="hl"><span class="hud-label">Perlu diasah</span><b>${g.low.raw===g.top.raw?(g.top.raw?"Semua kompetensi seimbang":"Belum ada observasi"):esc(g.low.c+" · "+g.low.n)}</b></div>
        <div class="hud-label" style="margin-top:4px">Lencana bagian</div>
        <div class="badges">${badges}</div>
      </div>
    </div>
    <div class="hud-foot hud-muted">XP: 100 per tugas sign-off · 25 per catatan · 5 per kompetensi · 2 per perilaku teramati</div>
  </section>`;
}

function mechProfile(){
  const t=S.trainees.find(x=>x.id===ME.profile?.trainee_id);

  const st=statsFor(t.id);
  const secs=SECTIONS.map(([sid,sname,list])=>{const ids=list.map((_,i)=>sid+"-"+(i+1));const d=ids.filter(i=>st.done.has(i)).length;
    const rows=ids.map(i=>{const [cls,lab]=taskStatus(st,i);const rc=S.refs.filter(r=>r.traineeId===t.id&&r.taskId===i).length;const ec=(st.byTask[i]||[]).length;
      return `<button type="button" class="task" data-task="${i}"><span class="t">${esc(TASK[i].name)}</span><span class="pill ${cls}">${lab}</span><span class="s">${[ec?ec+" catatan":"",rc?rc+" referensi":""].filter(Boolean).join(" · ")||"Ketuk untuk menambah referensi"}</span></button>`}).join("");
    return `<details class="group"><summary><h3 style="flex:1">${esc(sname)}</h3><span class="mono muted">${d}/${ids.length}</span></summary><div class="tasks">${rows}</div></details>`}).join("");
  const recent=[...st.entries].sort((a,b)=>(b.date||"").localeCompare(a.date||"")||(b.createdAt||0)-(a.createdAt||0)).slice(0,5);
  return `${statusCard(t)}
    <div class="panel"><h2>Penilaian terakhir</h2><div class="timeline">${recent.length?recent.map(entryHtml).join(""):`<p class="muted" style="margin:0">Belum ada penilaian. Minta assessor Anda mencatat tugas OJT pertama.</p>`}</div></div>

    <div class="panel" style="gap:0"><h2>Tugas OJT saya</h2><p class="muted" style="margin:4px 0 8px;font-size:13px">Ketuk tugas untuk melihat catatan assessor dan menambahkan referensi manual yang Anda pakai.</p>${secs}</div>
    ${idCard()}`;
}

/* ---------- export ---------- */
function csvCell(v){v=String(v??"");return /[",\n;]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function download(name,rows){const csv="﻿"+rows.map(r=>r.map(csvCell).join(",")).join("\r\n");
  const url=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));const a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);toast("File "+name+" diunduh")}
function exportEntries(only){
  const rows=[["Trainee","No. pegawai","Unit","Bagian","Tugas","Tanggal","P/D","Airplane ID & Type","Reference","Kompetensi teramati","Perilaku teramati","Trainer","Sign-off","Catatan"]];
  const tmap=Object.fromEntries(S.trainees.map(t=>[t.id,t]));
  [...S.signoffs].filter(s=>!only||s.traineeId===only).sort((a,b)=>((tmap[a.traineeId]?.name||"").localeCompare(tmap[b.traineeId]?.name||""))||(a.date||"").localeCompare(b.date||""))
   .forEach(s=>{const t=tmap[s.traineeId]||{};const k=TASK[s.taskId]||{};rows.push([t.name,t.empNo,tUnit(t),k.sname,k.name,s.date,s.mode,s.aircraft,s.reference,(s.comps||[]).join("-"),(s.beh||[]).map(b=>{const [c,i]=b.split("-");return c+": "+(BEH[c]?.[+i]||"")}).join(" | "),s.trainer,s.complete?"Ya":"",s.notes])});
  download(only?`CBTA_${(tmap[only]?.name||"trainee").replace(/[^\w-]+/g,"_")}_${today()}.csv`:`CBTA_semua_penilaian_${today()}.csv`,rows);
}
function exportSummary(){
  const rows=[["Trainee","No. pegawai","Unit","Perusahaan","Lokasi","Tugas selesai","% selesai","Pangkat","Terakhir dinilai",...SECTIONS.map(s=>s[1]),...COMPS.map(c=>c[0])]];
  [...S.trainees].sort((a,b)=>(a.name||"").localeCompare(b.name||"")).forEach(t=>{const g=gameFor(t);const st=g.st;
    rows.push([t.name,t.empNo,tUnit(t),t.company,t.location,st.done.size,Math.round(st.done.size/TOTAL*100),g.rank,st.last,
      ...SECTIONS.map(([sid,_,list])=>list.filter((_,i)=>st.done.has(sid+"-"+(i+1))).length+"/"+list.length),...COMPS.map(([c])=>st.comp[c])])});
  download(`CBTA_ringkasan_${today()}.csv`,rows);
}

/* ---------- Form Assessment Upgrading (exact replica of the Excel sheets) ---------- */
const FKINDS=[["mechanic","Mechanic"],["madya","Engineer Madya"],["senior","Engineer Senior"],["pqr","PQR Engineer"]];

let FORMS=[],HAS_FORMS=true,FORM_OV={},MYSIG=null,FDIRTY=new Set(),TPLEDIT=false,FKF="";
const XM={};
const XSTYLE={pqr:{E3:"padding-left:165px"}}; /* keep the PQR title clear of the logo */
const fromForm=r=>({id:r.id,traineeId:r.trainee_id,kind:r.kind,data:r.data||{},sigs:r.sigs||{},createdBy:r.created_by,createdAt:r.created_at,updatedAt:r.updated_at});
const xcol=n=>{let s="";while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=Math.floor((n-1)/26)}return s};

function xCover(T){const s=new Set();T.cells.forEach(c=>{for(let r=c[0];r<c[0]+c[2];r++)for(let k=c[1];k<c[1]+c[3];k++)if(r!==c[0]||k!==c[1])s.add(r+":"+k)});return s}
function sheetHtml(key,T,fill,extra){
  const byRow={};T.cells.forEach(c=>{(byRow[c[0]]=byRow[c[0]]||[]).push(c)});
  const W=T.cols.reduce((a,b)=>a+b,0),H=T.rows.reduce((a,b)=>a+b,0);const cov=T._cov||(T._cov=xCover(T));

/* Excel clips text in merged cells; shrink such text so it stays inside its box. */
function xfit(root){root.querySelectorAll(".xsheet td[colspan],.xsheet td[rowspan]").forEach(td=>{const x=td.firstElementChild;if(!x)return;const cs=getComputedStyle(td);if(cs.whiteSpace==="pre-wrap")return;
  const need=x.scrollWidth,have=td.clientWidth-4;if(have>0&&need>have+1)td.style.fontSize=Math.max(6,parseFloat(cs.fontSize)*have/need).toFixed(2)+"px"})}

function fmodel(kind){if(XM[kind])return XM[kind];const T=XT[kind];const at={};T.cells.forEach(c=>at[xcol(c[1])+c[0]]=c);

  const tx=ref=>(at[ref]?.[5]||"").trim();
  if(kind==="pqr"){
    for(let r=5;r<=10;r++)m.personal.push({ref:"G"+r,label:tx("C"+r)});
    T.cells.forEach(c=>{if(c[1]===4&&/^\d+$/.test(c[5].trim())&&at["E"+c[0]])m.items.push({row:c[0],no:c[5].trim(),key:"q"+c[0],label:"E"+c[0]})});
    m.avgRef="Q48";m.noteRef=T.cells.find(c=>/^NOTE/.test(c[5]))?.slice(0,2).reverse().map((v,i)=>i?v:xcol(v)).join("")||"B66";
    const keyOf={applicant:"applicant","assessor 1":"a1","assessor 2":"a2","acknowledged by":"ack"};
    T.cells.filter(c=>keyOf[c[5].trim().toLowerCase()]).forEach(c=>{const nm=T.cells.find(n=>n[1]===c[1]&&n[0]>c[0]&&/^\(\s*\)$/.test(n[5].trim()));if(!nm)return;
      const w=xs[nm[1]-1+nm[3]]-xs[nm[1]-1];m.slots.push({key:keyOf[c[5].trim().toLowerCase()],label:c[5].trim(),nameRef:xcol(nm[1])+nm[0],x:xs[nm[1]-1],w,y:ys[c[0]],h:ys[nm[0]-1]-ys[c[0]]})});
    m.items.forEach(it=>["Q","R","S"].forEach(cl=>m.dataRefs.add(cl+it.row)));["Q48","Q49","S49",m.noteRef].forEach(r=>m.dataRefs.add(r));
  }else{

    T.cells.forEach(c=>{const f=c[6]&&/^G(\d+)\*H\1$/.exec(c[6]);if(!f)return;const r=c[0];const subs=[];
      for(let rr=r+1;rr<r+c[2];rr++){const t=tx("C"+rr);if(t)subs.push({no:tx("B"+rr),ref:"C"+rr})}
      m.groups.push({row:r,no:tx("B"+r),title:"C"+r,weight:"G"+r,val:"H"+r,fin:"I"+r,subs})});
    const tot=T.cells.filter(c=>c[6]&&/^(SUM|AVERAGE)/.test(c[6]));m.totRow=tot.length?tot[0][0]:null;
    m.placeRef=(T.cells.find(c=>c[1]===2&&/^[….]{5}/.test(c[5].trim()))||[0,0]).slice(0,2).reverse().map((v,i)=>i?v:xcol(v)).join("");
    const lab=T.cells.filter(c=>/^PENILAI/.test(c[5].trim())),nms=T.cells.filter(c=>/Nama\s*\/\s*Jabatan/.test(c[5])).sort((a,b)=>a[1]-b[1]);
    const lineW=(r,c)=>{let w=0;for(let k=c;k<=T.cols.length;){const cc=at[xcol(k)+r];const cn=at[xcol(k)+(r+1)];const st=cc?T.styles[cc[4]]:"";
      if(cc&&/border-bottom/.test(st)){w+=xs[k-1+cc[3]]-xs[k-1];k+=cc[3]}else if(cn&&/border-top/.test(T.styles[cn[4]])&&k>c){w+=xs[k]-xs[k-1];k++}else break}return w};
    nms.forEach((nm,i)=>{const lr=(lab.find(l=>l[1]===nm[1])||lab[i]||[nm[0]-4])[0];const w=lineW(nm[0]-1,nm[1])||260;

const ftext=(kind,ref)=>{const o=FORM_OV[kind];if(o&&typeof o[ref]==="string")return o[ref];const c=fmodel(kind).at[ref];return c?c[5]:null};
function fnum(kind,f,ref){const d=f?f.data:{};if(d[ref]!==undefined&&d[ref]!==""){const v=parseFloat(String(d[ref]).replace(",","."));return isNaN(v)?null:v}
  const c=fmodel(kind).at[ref];if(!c)return null;if(c[6])return feval(kind,f,c[6]);
  const p=/^\s*(-?\d+(?:[.,]\d+)?)\s*(%?)\s*$/.exec(ftext(kind,ref)||"");if(!p)return null;const v=parseFloat(p[1].replace(",","."));return p[2]?v/100:v}
function feval(kind,f,ex){let m=/^([A-Z]+\d+)\*([A-Z]+\d+)$/.exec(ex);if(m)return (fnum(kind,f,m[1])||0)*(fnum(kind,f,m[2])||0);

  if(/0\.00/.test(nf||""))return v.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});if(nf==="0")return String(Math.round(v));return String(Math.round(v*100)/100)}

async function fFresh(f,cols){const {data,error}=await sb.from("assessment_forms").select(cols).eq("id",f.id).single();if(error)throw error;return data}
function fApply(f,row){if(!row)return;Object.assign(f,fromForm({...{id:f.id,trainee_id:f.traineeId,kind:f.kind,created_by:f.createdBy,created_at:f.createdAt,updated_at:f.updatedAt,data:f.data,sigs:f.sigs},...row}))}
function bindFormView(f){drawPrev(f);
  $("#fBack").onclick=()=>{location.hash=ROLE==="mekanik"?"formulir":"formulir"};
  $("#fPrint").onclick=$("#fPrint2").onclick=()=>printSheet(f.kind);
  const fm=$("#fForm");let tmr;
  const td=$("#fToday");if(td)td.onclick=()=>{const m=fmodel(f.kind);const el=fm.querySelector(`[data-k="${m.placeRef}"]`);const today=new Date().toLocaleDateString("id-ID",{day:"numeric",month:"long",year:"numeric"});
    const place=(el.value.split(",")[0]||"").trim()||(personById(f.traineeId)?.location||"");el.value=(place?place+", ":"")+today;el.dispatchEvent(new Event("input"))};
  const refresh=()=>{clearTimeout(tmr);tmr=setTimeout(()=>{drawPrev(f);const m=fmodel(f.kind);
    if(f.kind==="pqr"){const a=pqrAvg(f);$("#fAvg").textContent=a===null?"–":a.toFixed(1);m.items.forEach(it=>{const n=fScore(f.data[it.key]);const p=fm.querySelector(`[data-cat="${it.key}"]`);p.textContent=n===null?"–":pqrCat(n)[1];p.className="pill "+(n===null?"none":n<71?"prog":"done")})}
    else{$("#fTot").textContent=fmtNum(fTotal(f),"#,##0.00");m.groups.forEach(g=>{const v=fScore(f.data[g.val]);fm.querySelector(`[data-fin="${g.val}"]`).textContent=v===null?"–":fmtNum((fnum(f.kind,f,g.weight)||0)*v,"#,##0.00")})}},120)};
  fm.querySelectorAll("[data-k]").forEach(el=>{const ev=el.type==="radio"?"change":"input";el.addEventListener(ev,()=>{if(el.type==="radio"&&!el.checked)return;const k=el.dataset.k;
    let v=el.value;if(el.type==="number"&&v!==""){const n=fScore(v);if(n!==null&&(n<0||n>100)){el.setCustomValidity("Isi 0 sampai 100");el.reportValidity();return}el.setCustomValidity("")}
    if(v==="")delete f.data[k];else f.data[k]=v;FDIRTY.add(k);const sv=$("#fSave");if(sv)sv.disabled=false;const st=$("#fState");if(st)st.textContent="Belum disimpan";refresh()})});
  fm.onsubmit=async e=>{e.preventDefault();if(!FDIRTY.size)return;const sv=$("#fSave");sv.disabled=true;
    try{const cur=await fFresh(f,"data");const nd={...(cur.data||{})};FDIRTY.forEach(k=>{const v=f.data[k];if(v===undefined||v==="")delete nd[k];else nd[k]=v});
      const {data:row,error}=await sb.from("assessment_forms").update({data:nd}).eq("id",f.id).select().single();if(error)throw error;
      FDIRTY.clear();fApply(f,row);$("#fState").textContent="Tersimpan";toast("Form disimpan")}
    catch(err){sv.disabled=false;toast(err&&err.message&&/Mekanik|Hanya|Kolom|Tanda/.test(err.message)?err.message:"Gagal menyimpan form.")}};
  document.querySelectorAll("[data-gosig]").forEach(a=>a.onclick=()=>{setTimeout(()=>{const s=$("#sec-ttd");if(s)s.scrollIntoView()},120)});
  document.querySelectorAll("[data-sign]").forEach(b=>b.onclick=async()=>{const key=b.dataset.sign;b.disabled=true;
    try{if(FDIRTY.size){await new Promise(r=>{fm.requestSubmit();setTimeout(r,600)})}
      const cur=await fFresh(f,"sigs");const title=($(`[data-sigtitle="${key}"]`)?.value||"").trim();
      const sigs={...(cur.sigs||{}),[key]:{uid:ME.id,title}};const {data:row,error}=await sb.from("assessment_forms").update({sigs}).eq("id",f.id).select().single();if(error)throw error;
      fApply(f,row);toast("Form ditandatangani");render()}
    catch(err){b.disabled=false;toast(err&&err.message&&/Tanda|Kolom|Hanya|Buat/.test(err.message)?err.message:"Gagal menandatangani.")}});
  document.querySelectorAll("[data-unsign]").forEach(b=>armDelete(b,"Yakin hapus?",async()=>{const key=b.dataset.unsign;
    try{const cur=await fFresh(f,"sigs");const sigs={...(cur.sigs||{})};delete sigs[key];const {data:row,error}=await sb.from("assessment_forms").update({sigs}).eq("id",f.id).select().single();if(error)throw error;
      fApply(f,row);if(f.sigs[key])delete f.sigs[key];toast("Tanda tangan dihapus");render()}catch(err){b.disabled=false;toast("Gagal menghapus tanda tangan.")}}));
  const te=$("#tplEdit");if(te)te.onclick=()=>{TPLEDIT=true;render()};
  const tc=$("#tplCancel");if(tc)tc.onclick=()=>{TPLEDIT=false;render()};
  const tr=$("#tplReset");if(tr)tr.onclick=()=>{$("#xprev").querySelectorAll("[data-tpl]").forEach(s=>{const c=fmodel(f.kind).at[s.dataset.tpl];s.textContent=c?c[5]:""});toast("Teks dikembalikan. Tekan Simpan template untuk menyimpan.")};
  const ts=$("#tplSave");if(ts)ts.onclick=async()=>{ts.disabled=true;const ov={};const m=fmodel(f.kind);
    $("#xprev").querySelectorAll("[data-tpl]").forEach(s=>{const ref=s.dataset.tpl;const base=m.at[ref]?m.at[ref][5]:"";const v=s.innerText.replace(/ /g," ").replace(/\n$/,"");if(v!==base)ov[ref]=v.slice(0,500)});
    const all={...FORM_OV,[f.kind]:ov};if(!Object.keys(ov).length)delete all[f.kind];
    const {error}=await sb.from("app_settings").upsert({key:"form_overrides",value:all,updated_at:new Date().toISOString()});
    if(error){ts.disabled=false;toast("Gagal menyimpan template.");return}FORM_OV=all;TPLEDIT=false;toast("Template disimpan");render()};
  armDelete($("#fDel"),"Yakin? Form ini dihapus permanen",async()=>{const {error}=await sb.from("assessment_forms").delete().eq("id",f.id);if(error){toast("Gagal menghapus form.");return}
    FORMS=FORMS.filter(x=>x.id!==f.id);toast("Form dihapus");location.hash="formulir"});
}

function sigSettingsHtml(){if(!HAS_FORMS)return "";
  return `<section class="panel" id="sec-ttd"><h2>Tanda tangan saya</h2>
    <p class="muted" style="margin:0;font-size:13.5px">Dipakai saat Anda menandatangani form assessment. Hanya Anda yang dapat melihat dan mengubah tanda tangan ini.</p>
    ${MYSIG?`<div class="sigcur"><span class="muted" style="font-size:12.5px">Tersimpan:</span><img src="${esc(MYSIG)}" alt="Tanda tangan saya"></div>`:""}
    <canvas id="sigPad" width="600" height="220" aria-label="Area tanda tangan"></canvas>
    <div class="actions"><button type="button" class="ghost" id="sigUp">Unggah gambar</button><input type="file" id="sigFile" accept="image/*" hidden>
      <button type="button" id="sigClr">Bersihkan</button>${MYSIG?`<button type="button" class="ghost danger" id="sigDel">Hapus</button>`:""}<button type="button" class="primary" id="sigSave">Simpan tanda tangan</button></div></section>`}
function bindSigSettings(){const c=$("#sigPad");if(!c)return;const g=c.getContext("2d");let drawing=false,dirty=false,last=null;
  const reset=()=>{g.clearRect(0,0,c.width,c.height);g.strokeStyle="#c9d1d8";g.lineWidth=1;g.beginPath();g.moveTo(30,170);g.lineTo(570,170);g.stroke();dirty=false};reset();
  const pt=e=>{const r=c.getBoundingClientRect();return [(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]};
  c.onpointerdown=e=>{if(!dirty){g.clearRect(0,0,c.width,c.height)}drawing=true;dirty=true;last=pt(e);c.setPointerCapture(e.pointerId);e.preventDefault()};
  c.onpointermove=e=>{if(!drawing)return;const p=pt(e);g.strokeStyle="#0b1f4d";g.lineWidth=3;g.lineCap="round";g.lineJoin="round";g.beginPath();g.moveTo(...last);g.lineTo(...p);g.stroke();last=p};
  c.onpointerup=c.onpointercancel=()=>{drawing=false};
  $("#sigClr").onclick=reset;$("#sigUp").onclick=()=>$("#sigFile").click();
  $("#sigFile").onchange=async()=>{const file=$("#sigFile").files[0];if(!file)return;try{const url=await shrinkImage(file,600,"image/png");const im=new Image();im.onload=()=>{g.clearRect(0,0,c.width,c.height);const k=Math.min(c.width/im.width,c.height/im.height);g.drawImage(im,(c.width-im.width*k)/2,(c.height-im.height*k)/2,im.width*k,im.height*k);dirty=true};im.src=url}catch(e){toast("Gambar tidak bisa dibaca.")}};
  $("#sigSave").onclick=async()=>{if(!dirty){toast("Gambar tanda tangan dulu di kotak.");return}
    const id=g.getImageData(0,0,c.width,c.height).data;let x0=c.width,y0=c.height,x1=-1,y1=-1;
    for(let y=0;y<c.height;y++)for(let x=0;x<c.width;x++){if(id[(y*c.width+x)*4+3]>20){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}}
    if(x1<0){toast("Kotak masih kosong.");return}const pad=6;x0=Math.max(0,x0-pad);y0=Math.max(0,y0-pad);x1=Math.min(c.width-1,x1+pad);y1=Math.min(c.height-1,y1+pad);
    const o=document.createElement("canvas");o.width=x1-x0+1;o.height=y1-y0+1;o.getContext("2d").drawImage(c,x0,y0,o.width,o.height,0,0,o.width,o.height);const img=o.toDataURL("image/png");
    const {error}=await sb.from("signatures").upsert({user_id:ME.id,img,updated_at:new Date().toISOString()});if(error){toast("Gagal menyimpan tanda tangan.");return}
    MYSIG=img;toast("Tanda tangan disimpan");render();setTimeout(()=>{const s=$("#sec-ttd");if(s)s.scrollIntoView()},60)};
  const del=$("#sigDel");if(del)armDelete(del,"Yakin hapus?",async()=>{const {error}=await sb.from("signatures").delete().eq("user_id",ME.id);if(error){toast("Gagal menghapus.");return}MYSIG=null;toast("Tanda tangan dihapus");render()});
}

async function fetchAll(table,map){const out=[];for(let from=0;;from+=1000){const {data,error}=await sb.from(table).select("*").order("created_at").range(from,from+999);if(error)throw error;out.push(...data.map(map));if(data.length<1000)break}return out}
async function loadAll(){
  try{const [t,s2,cfg]=await Promise.all([fetchAll("trainees",fromTrainee),fetchAll("signoffs",fromSignoff),sb.from("app_settings").select("key,value")]);S.trainees=t.filter(x=>x.position!=="engineer");S.engineers=t.filter(x=>x.position==="engineer");S.signoffs=s2;S.offline=false;
    (cfg.data||[]).forEach(r=>{if(r.key==="units")setUnits(r.value);if(r.key==="milestones"){const m=cleanMilestones(r.value);if(m)MILESTONES=m}if(r.key==="stale_days"&&+r.value>0)STALE_DAYS=+r.value;if(r.key==="form_overrides"&&r.value&&typeof r.value==="object")FORM_OV=r.value;if(r.key==="stat_max"&&+r.value>0)STAT_MAX=+r.value});setBrand((cfg.data||[]).filter(r=>r.key.startsWith("brand_")))}
  catch(e){S.offline=true}
  try{S.refs=await fetchAll("task_refs",fromRef)}catch(e){S.refs=[]} /* table appears after migration 004 */
  try{FORMS=await fetchAll("assessment_forms",fromForm);HAS_FORMS=true}catch(e){FORMS=[];HAS_FORMS=false} /* table appears after migration 006 */
  if(ROLE==="admin")await loadUsers();
}
let reloadTimer=null,channel=null;
function scheduleReload(){clearTimeout(reloadTimer);reloadTimer=setTimeout(async()=>{await loadAll();
  if(document.querySelector("#fTrainee,#fProf,#fApp,#fUser,#fMs,#fUnits")||FDIRTY.size||TPLEDIT||($("#rNew")&&$("#rNew").value)||document.activeElement?.id==="refQ")return; /* don't wipe a form being typed */
  render();refreshSheet()},800)}
async function applySession(session){
  if(channel){sb.removeChannel(channel);channel=null}
  if(!session){ROLE="anon";REAL="anon";ME.id=null;ME.name="";ME.email="";ME.profile=null;S.trainees=[];S.signoffs=[];S.ready=true;render();return}
  ME.id=session.user.id;ME.email=session.user.email||"";VIEWUNIT=null;
  const {data:prof}=await sb.from("profiles").select("*").eq("id",ME.id).maybeSingle();
  ME.profile=prof||{};REAL=prof?.role||"pending";ROLE=EFF_ROLE[REAL]||REAL;ME.name=prof?.full_name||"";
  if(prof?.prefs?.trainer&&!lsGet("cbta.trainer"))lsSet("cbta.trainer",prof.prefs.trainer);
  if(prof?.prefs?.aircraft&&!lsGet("cbta.aircraft"))lsSet("cbta.aircraft",prof.prefs.aircraft);
  if(isStaff()||ROLE==="mekanik"){S.ready=false;$("#app").innerHTML=`<div class="panel"><p class="muted" style="margin:0">Memuat data…</p></div>`;await loadAll();
    channel=sb.channel("cbta").on("postgres_changes",{event:"*",schema:"public",table:"signoffs"},scheduleReload).on("postgres_changes",{event:"*",schema:"public",table:"trainees"},scheduleReload).on("postgres_changes",{event:"*",schema:"public",table:"task_refs"},scheduleReload);
    if(HAS_FORMS)channel.on("postgres_changes",{event:"*",schema:"public",table:"assessment_forms"},scheduleReload);channel.subscribe();
    if(HAS_FORMS){try{const {data}=await sb.from("signatures").select("img").eq("user_id",ME.id).maybeSingle();MYSIG=data?.img||null}catch(e){MYSIG=null}}
    if(ROLE==="admin"&&USERS.some(u=>u.role==="pending"))setTimeout(()=>toast("Ada pengajuan akun baru di tab Pengguna."),600);}
  S.ready=true;render();
}
let lastUid;
loadBrand();
/* Sign out must always work, even on a slow or dropped phone connection: try the server, fall back to clearing this device, then reload. */
$("#btnOut").onclick=async()=>{if(!sb)return;const b=$("#btnOut");b.disabled=true;b.textContent="Keluar…";
  const wait=(p,ms)=>Promise.race([p.catch(e=>({error:e})),new Promise(r=>setTimeout(()=>r({error:"timeout"}),ms))]);
  const r=await wait(sb.auth.signOut(),4000);if(r&&r.error)await wait(sb.auth.signOut({scope:"local"}),2000);
  try{Object.keys(localStorage).filter(k=>/^sb-.*-auth-token/.test(k)).forEach(k=>localStorage.removeItem(k))}catch(e){}
  location.replace(location.pathname)};
if(sb){
  sb.auth.onAuthStateChange((ev,session)=>{
    if(ev==="PASSWORD_RECOVERY"){RECOVERY=true;lastUid=session?.user?.id;setTimeout(render,0);return}
    const uid=session?.user?.id||null;if(ev!=="INITIAL_SESSION"&&uid===lastUid)return;lastUid=uid;setTimeout(()=>applySession(session),0)});
}else{S.ready=true;render()}
</script>
</body></html>
